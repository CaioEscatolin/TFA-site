<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="img/icone_acessibilidade_16x16.png">
    
    <style>
        :root {
            --primary-color: #4169E1;       /* Azul Royal */
            --primary-hover: #2e4fa3;       /* Azul Royal Escuro */
            --primary-light: #eef2ff;       /* Azul Royal Ultra Claro */
            --text-main: #1e293b;           /* Cinza Escuro quase preto */
            --text-muted: #64748b;          /* Cinza Médio */
            --bg-body: #f8fafc;             /* Fundo do site levemente cinza */
            --border-color: #cbd5e1;        /* Borda padrão */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: #ffffff;
            padding: 45px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            border: 1px solid #edf2f7;
        }

        /* Logotipo ou Ícone da Empresa */
        .brand-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo i {
            font-size: 36px;
            color: var(--primary-color);
            background-color: var(--primary-light);
            padding: 16px;
            border-radius: 12px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        /* Container do Input com Ícone */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        /* Efeito de foco profissional */
        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(65, 105, 225, 0.15);
            outline: none;
        }

        .input-wrapper input:focus + i {
            color: var(--primary-color);
        }

        /* Opções extras (Lembrar/Esqueceu) */
        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .checkbox-label {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .auth-actions a, .toggle-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-actions a:hover, .toggle-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Botão Principal Em bloco */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(65, 105, 225, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 10px 15px -3px rgba(65, 105, 225, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Rodapé de alternância */
        .auth-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }

        /* Caixa de mensagem de erro/sucesso */
        .msg {
            display: none;
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg.erro { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .msg.ok   { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

        /* Classe utilitária para esconder telas via JS se necessário */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="login-card">
        <div class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <div class="auth-header">
            <h2>Acessar sua conta</h2>
            <p>Insira suas credenciais corporativas</p>
        </div>

        <form id="form-login">
            <div class="msg" id="msg-login"></div>
            <div class="form-group">
                <label for="login-email">E-mail Corporativo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="nome@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="login-password">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="auth-actions">
                <label class="checkbox-label">
                    <input type="checkbox" id="lembrar" checked> Lembrar neste dispositivo
                </label>
                <a href="#" id="link-reset">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar no sistema</button>

            <div class="auth-footer">
                <p>Novo por aqui? <a href="#" class="toggle-link" onclick="toggleCard()">Criar uma conta</a></p>
            </div>
        </form>
    </div>

    <div class="auth-container hidden" id="register-card">
        <div class="brand-logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        
        <div class="auth-header">
            <h2>Comece agora</h2>
            <p>Crie sua conta de acesso em poucos passos</p>
        </div>

        <form id="form-registro">
            <div class="msg" id="msg-registro"></div>
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="reg-name" placeholder="Ex: João Silva" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-password">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>
                </div>
            </div>

            <div class="auth-actions">
                <label class="checkbox-label" style="align-items: flex-start;">
                    <input type="checkbox" required>
                    <span>Aceito os <a href="#">Termos de Serviço</a> e <a href="#">Políticas de Privacidade</a>.</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>

            <div class="auth-footer">
                <p>Já possui cadastro? <a href="#" class="toggle-link" onclick="toggleCard()">Fazer Login</a></p>
            </div>
        </form>
    </div>

    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            updateProfile,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            doc, setDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Para onde mandar o usuário depois de entrar (?redirect=pesquisa.html)
        const destino = new URLSearchParams(location.search).get("redirect") || "index.html";

        // Alterna entre os cards de Login e Cadastro
        window.toggleCard = function () {
            document.getElementById('login-card').classList.toggle('hidden');
            document.getElementById('register-card').classList.toggle('hidden');
        };

        function mostrar(id, texto, tipo = "erro") {
            const box = document.getElementById(id);
            box.className = "msg " + tipo;
            box.textContent = texto;
        }

        // Traduz os códigos de erro do Firebase para português
        function traduzirErro(code) {
            const mapa = {
                "auth/invalid-email": "E-mail inválido.",
                "auth/missing-password": "Digite sua senha.",
                "auth/weak-password": "A senha precisa ter no mínimo 6 caracteres.",
                "auth/email-already-in-use": "Este e-mail já possui cadastro. Faça login.",
                "auth/invalid-credential": "E-mail ou senha incorretos.",
                "auth/wrong-password": "E-mail ou senha incorretos.",
                "auth/user-not-found": "Não encontramos uma conta com esse e-mail.",
                "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos.",
                "auth/network-request-failed": "Sem conexão com o servidor."
            };
            return mapa[code] || "Não foi possível concluir. (" + code + ")";
        }

        // ---------- CADASTRO ----------
        document.getElementById("form-registro").addEventListener("submit", async (e) => {
            e.preventDefault();
            const botao = e.target.querySelector("button[type=submit]");
            const nome  = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const senha = document.getElementById("reg-password").value;

            botao.disabled = true;
            botao.textContent = "Criando conta...";
            try {
                // 1. Cria o usuário no Authentication
                const cred = await createUserWithEmailAndPassword(auth, email, senha);

                // 2. Guarda o nome no próprio perfil de autenticação
                await updateProfile(cred.user, { displayName: nome });

                // 3. Cria o documento de perfil no Firestore: usuarios/{uid}
                await setDoc(doc(db, "usuarios", cred.user.uid), {
                    nome: nome,
                    email: email,
                    criadoEm: serverTimestamp(),
                    ultimoLogin: serverTimestamp(),
                    respostasEnviadas: 0
                });

                mostrar("msg-registro", "Conta criada! Redirecionando...", "ok");
                location.href = destino;
            } catch (err) {
                mostrar("msg-registro", traduzirErro(err.code));
                botao.disabled = false;
                botao.textContent = "Finalizar Cadastro";
            }
        });

        // ---------- LOGIN ----------
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const botao = e.target.querySelector("button[type=submit]");
            const email = document.getElementById("login-email").value.trim();
            const senha = document.getElementById("login-password").value;
            const lembrar = document.getElementById("lembrar").checked;

            botao.disabled = true;
            botao.textContent = "Entrando...";
            try {
                // "Lembrar neste dispositivo": mantém a sessão mesmo fechando o navegador
                await setPersistence(auth, lembrar ? browserLocalPersistence : browserSessionPersistence);
                const cred = await signInWithEmailAndPassword(auth, email, senha);

                // Atualiza (ou recria) o perfil, sem apagar o que já existe
                await setDoc(doc(db, "usuarios", cred.user.uid), {
                    email: cred.user.email,
                    nome: cred.user.displayName || email,
                    ultimoLogin: serverTimestamp()
                }, { merge: true });

                location.href = destino;
            } catch (err) {
                mostrar("msg-login", traduzirErro(err.code));
                botao.disabled = false;
                botao.textContent = "Entrar no sistema";
            }
        });

        // ---------- ESQUECEU A SENHA ----------
        document.getElementById("link-reset").addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            if (!email) return mostrar("msg-login", "Digite seu e-mail no campo acima e clique novamente.");
            try {
                await sendPasswordResetEmail(auth, email);
                mostrar("msg-login", "Enviamos um link de redefinição para " + email + ".", "ok");
            } catch (err) {
                mostrar("msg-login", traduzirErro(err.code));
            }
        });
    </script>
</body>
</html>
